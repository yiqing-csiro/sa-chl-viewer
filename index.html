<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="description" content="South Australian coastal chlorophyll history and forecast">
    <title>SA Coastal Chlorophyll Forecast</title>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.8.0/dist/maplibre-gl.css">
    <link rel="stylesheet" href="email-report.css">
    <style>
      :root { color-scheme: light; font-family: Inter, Arial, sans-serif; }
      * { box-sizing: border-box; }
      html, body, #map { width: 100%; height: 100%; margin: 0; }
      body { overflow: hidden; background: #dce7ec; }
      #map { position: absolute; inset: 0; }
      .card {
        position: absolute; z-index: 2; color: #17313a; background: rgba(255,255,255,.95);
        border: 1px solid rgba(23,49,58,.16); border-radius: 10px;
        box-shadow: 0 3px 16px rgba(16,39,48,.18); backdrop-filter: blur(5px);
      }
      #status { top: 16px; left: 16px; max-width: min(440px, calc(100vw - 32px)); padding: 12px 15px; }
      .brand { display: flex; align-items: center; gap: 13px; }
      .brand-lockup { display: flex; flex: 0 0 auto; flex-direction: column; align-items: center; gap: 3px; }
      #csiro-logo { width: 64px; height: 64px; flex: 0 0 auto; object-fit: contain; }
      .aquawatch-name {
        color: #29464f; font: 600 10px/1.15 Georgia, "Times New Roman", serif;
        letter-spacing: .025em; text-align: center; white-space: nowrap;
      }
      h1 { margin: 0 0 5px; font-size: 18px; line-height: 1.25; }
      #summary { margin: 0; font-size: 13px; line-height: 1.4; }
      #updated { margin-top: 5px; color: #536b74; font-size: 11px; }
      #legend { right: 16px; bottom: 160px; width: 245px; padding: 10px 12px; }
      .legend-title { margin-bottom: 7px; font-size: 13px; font-weight: 700; }
      #colorbar { display: block; width: 100%; height: 18px; border-radius: 3px; }
      .ticks { display: flex; justify-content: space-between; margin-top: 3px; font-size: 10px; }
      .unit { margin-top: 4px; text-align: center; font-size: 11px; }
      .key { display: flex; gap: 12px; margin-top: 8px; font-size: 11px; }
      .key span::before { content: ""; display: inline-block; width: 9px; height: 9px; margin-right: 5px; border-radius: 50%; }
      .history::before { background: #168aad; }
      .forecast::before { background: #d95f02; }
      #timeline { right: 16px; bottom: 16px; left: 16px; padding: 10px 12px 9px; }
      .timeline-header { display: flex; align-items: center; gap: 7px; margin-bottom: 5px; }
      .timeline-header button {
        min-width: 34px; height: 30px; padding: 0 8px; color: #17313a; background: #fff;
        border: 1px solid #9badb4; border-radius: 5px; cursor: pointer; font-size: 14px;
      }
      .timeline-header button:hover, .timeline-header button:focus-visible { background: #e7f2f5; outline: 2px solid #168aad; outline-offset: 1px; }
      #current-week { margin-left: 5px; font-size: 14px; }
      #current-kind { padding: 3px 7px; border-radius: 10px; color: white; font-size: 11px; }
      #current-kind.inpainted { background: #168aad; }
      #current-kind.forecast { background: #d95f02; }
      .timeline-scroll { overflow-x: auto; padding: 0 4px 3px; }
      .timeline-track { min-width: 980px; }
      .timeline-range { position: relative; height: 19px; margin: 1px 0 3px; cursor: pointer; touch-action: none; }
      .timeline-range:focus-within { outline: 2px solid #168aad; outline-offset: 2px; border-radius: 5px; }
      #timeline-rail { position: absolute; top: 8px; height: 3px; background: #91a8b0; border-radius: 2px; pointer-events: none; }
      #timeline-dot {
        position: absolute; top: 3px; width: 13px; height: 13px; border: 2px solid #fff;
        border-radius: 50%; background: #168aad; box-shadow: 0 0 0 1px #176f8c;
        transform: translateX(-50%); pointer-events: none;
      }
      #timeline-dot.forecast { background: #d95f02; box-shadow: 0 0 0 1px #a94600; }
      #week-slider { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; pointer-events: none; }
      #week-labels { display: grid; grid-template-columns: repeat(14, minmax(66px, 1fr)); gap: 2px; }
      #week-labels button {
        padding: 3px 1px 2px; border: 0; border-top: 3px solid #168aad; color: #35515b;
        background: transparent; cursor: pointer; font-size: 10px; white-space: nowrap;
      }
      #week-labels button.forecast { border-top-color: #d95f02; }
      #week-labels button.active { color: #102b34; background: #dceff4; font-weight: 700; }
      #week-labels button.forecast.active { background: #f9e4d6; }
      #error { display: none; margin-top: 5px; color: #a02020; font-size: 12px; }
      @media (max-width: 620px) {
        #status { top: 8px; left: 8px; max-width: calc(100vw - 16px); padding: 9px 11px; }
        #csiro-logo { width: 48px; height: 48px; }
        .aquawatch-name { font-size: 8px; }
        h1 { font-size: 15px; }
        #summary { font-size: 11px; }
        #legend { right: 8px; bottom: 174px; width: 205px; }
        #timeline { right: 8px; bottom: 8px; left: 8px; }
        #current-week { font-size: 12px; }
      }
    </style>
  </head>
  <body>
    <main id="map" aria-label="Map of South Australian coastal chlorophyll"></main>
    <section id="status" class="card" aria-live="polite">
      <div class="brand">
        <div class="brand-lockup">
          <img id="csiro-logo" src="logo/CSIRO_Logo.svg" alt="CSIRO">
          <span class="aquawatch-name">AquaWatch Australia</span>
        </div>
        <div>
          <h1>SA Coastal Chlorophyll Forecast</h1>
          <p id="summary">Loading the latest 10-week history and four-week forecast…</p>
          <div id="updated"></div>
          <div class="viewer-actions">
            <a id="view-3d" href="3d.html">Explore in 3D</a>
            <span data-forecast-email></span>
          </div>
        </div>
      </div>
      <div id="error"></div>
    </section>
    <section id="legend" class="card" aria-label="Chlorophyll colour scale">
      <div class="legend-title">Chlorophyll-a concentration</div>
      <canvas id="colorbar" width="600" height="36"></canvas>
      <div class="ticks"><span>0</span><span>5</span><span>10</span><span>15</span><span>20</span></div>
      <div class="unit">mg m<sup>−3</sup></div>
      <div class="key"><span class="history">Historical</span><span class="forecast">Forecast</span></div>
    </section>
    <section id="timeline" class="card" aria-label="Weekly chlorophyll timeline">
      <div class="timeline-header">
        <button id="previous" type="button" aria-label="Previous week">◀</button>
        <button id="play" type="button" aria-label="Play timeline">▶</button>
        <button id="next" type="button" aria-label="Next week">▶|</button>
        <strong id="current-week">Loading…</strong>
        <span id="current-kind"></span>
      </div>
      <div class="timeline-scroll">
        <div class="timeline-track">
          <div id="timeline-range" class="timeline-range">
            <div id="timeline-rail"></div>
            <span id="timeline-dot"></span>
            <input id="week-slider" type="range" min="0" max="13" value="9" step="1" aria-label="Select week">
          </div>
          <div id="week-labels"></div>
        </div>
      </div>
    </section>
    <script>
      function turbo(x) {
        const c = [
          [0.13572138,4.6153926,-42.66032258,132.13108234,-152.94239396,59.28637943],
          [0.09140261,2.19418839,4.84296658,-14.18503333,4.27729857,2.82956604],
          [0.1066733,12.64194608,-60.58204836,110.36276771,-89.90310912,27.34824973]
        ];
        x = Math.max(0, Math.min(1, x));
        return c.map(k => Math.round(255 * Math.max(0, Math.min(1,
          k[0] + x*(k[1] + x*(k[2] + x*(k[3] + x*(k[4] + x*k[5]))))
        ))));
      }
      const canvas = document.getElementById("colorbar");
      const ctx = canvas.getContext("2d");
      for (let px = 0; px < canvas.width; px++) {
        const rgb = turbo(Math.pow(px / (canvas.width - 1), 1 / 3));
        ctx.fillStyle = `rgb(${rgb.join(",")})`;
        ctx.fillRect(px, 0, 1, canvas.height);
      }
    </script>
    <script type="module">
      import * as maplibregl from "https://unpkg.com/maplibre-gl@6.8.0/dist/maplibre-gl.mjs";

      const slider = document.getElementById("week-slider");
      const labels = document.getElementById("week-labels");
      const timelineRange = document.getElementById("timeline-range");
      const timelineRail = document.getElementById("timeline-rail");
      const timelineDot = document.getElementById("timeline-dot");
      const currentWeek = document.getElementById("current-week");
      const currentKind = document.getElementById("current-kind");
      const playButton = document.getElementById("play");
      let release;
      let map;
      let selectedIndex = 0;
      let playTimer;

      function selectFrame(index) {
        selectedIndex = Math.max(0, Math.min(release.entries.length - 1, Number(index)));
        const entry = release.entries[selectedIndex];
        slider.value = selectedIndex;
        currentWeek.textContent = entry.label;
        currentKind.textContent = entry.kind === "forecast" ? `Forecast +${entry.lead_weeks}` : "Historical";
        currentKind.className = entry.kind;
        labels.querySelectorAll("button").forEach((button, position) => {
          button.classList.toggle("active", position === selectedIndex);
          button.setAttribute("aria-current", position === selectedIndex ? "date" : "false");
        });
        const source = map && map.getSource("chlorophyll");
        if (source) source.setTiles([entry.tile_url]);
        positionTimelineIndicator();
      }

      function weekCenter(button) {
        const buttonBounds = button.getBoundingClientRect();
        const rangeBounds = timelineRange.getBoundingClientRect();
        return buttonBounds.left - rangeBounds.left + buttonBounds.width / 2;
      }

      function positionTimelineIndicator() {
        const buttons = labels.querySelectorAll("button");
        if (!buttons.length) return;
        const first = weekCenter(buttons[0]);
        const last = weekCenter(buttons[buttons.length - 1]);
        timelineRail.style.left = `${first}px`;
        timelineRail.style.width = `${last - first}px`;
        timelineDot.style.left = `${weekCenter(buttons[selectedIndex])}px`;
        timelineDot.classList.toggle("forecast", release.entries[selectedIndex].kind === "forecast");
      }

      function selectPointerWeek(event) {
        const bounds = timelineRange.getBoundingClientRect();
        const pointerX = event.clientX - bounds.left;
        const buttons = [...labels.querySelectorAll("button")];
        let nearest = 0;
        buttons.forEach((button, index) => {
          if (Math.abs(weekCenter(button) - pointerX) <
              Math.abs(weekCenter(buttons[nearest]) - pointerX)) nearest = index;
        });
        selectFrame(nearest);
      }

      function stopPlaying() {
        clearInterval(playTimer);
        playTimer = undefined;
        playButton.textContent = "▶";
        playButton.setAttribute("aria-label", "Play timeline");
      }

      function togglePlaying() {
        if (playTimer) {
          stopPlaying();
          return;
        }
        playButton.textContent = "Ⅱ";
        playButton.setAttribute("aria-label", "Pause timeline");
        playTimer = setInterval(() => {
          selectFrame((selectedIndex + 1) % release.entries.length);
        }, release.timeline?.speed_ms || 800);
      }

      async function start() {
        try {
          const response = await fetch(`release.json?v=${Date.now()}`, {cache: "no-store"});
          if (!response.ok) throw new Error(`release.json returned ${response.status}`);
          release = await response.json();
          if (release.schema_version < 2 || release.entries.length !== 14) {
            throw new Error("Expected a schema v2 release with 14 weekly frames");
          }

          slider.max = release.entries.length - 1;
          selectedIndex = Math.max(0, release.history_weeks - 1);
          slider.value = selectedIndex;
          for (const [index, entry] of release.entries.entries()) {
            const button = document.createElement("button");
            button.type = "button";
            button.textContent = entry.label;
            button.className = entry.kind;
            const kindLabel = entry.kind === "forecast" ? `Forecast +${entry.lead_weeks}` : "Historical";
            button.setAttribute("aria-label", `${entry.label}, ${kindLabel}`);
            button.addEventListener("click", () => selectFrame(index));
            labels.appendChild(button);
          }

          map = new maplibregl.Map({
            container: "map",
            style: release.map.basemap_style_url,
            center: release.map.center,
            zoom: release.map.zoom
          });
          map.addControl(new maplibregl.NavigationControl(), "top-right");
          map.on("load", () => {
            const initial = release.entries[selectedIndex];
            map.addSource("chlorophyll", {
              type: "raster",
              tiles: [initial.tile_url],
              tileSize: 256,
              bounds: release.map.bounds
            });
            map.addLayer({id: "chlorophyll", type: "raster", source: "chlorophyll"});
          });

          slider.addEventListener("input", event => selectFrame(event.target.value));
          timelineRange.addEventListener("pointerdown", event => {
            event.preventDefault();
            slider.focus({preventScroll: true});
            timelineRange.setPointerCapture(event.pointerId);
            selectPointerWeek(event);
          });
          timelineRange.addEventListener("pointermove", event => {
            if (timelineRange.hasPointerCapture(event.pointerId)) selectPointerWeek(event);
          });
          timelineRange.addEventListener("pointerup", event => {
            if (timelineRange.hasPointerCapture(event.pointerId)) {
              timelineRange.releasePointerCapture(event.pointerId);
            }
          });
          if ("ResizeObserver" in window) {
            new ResizeObserver(positionTimelineIndicator).observe(labels);
          } else {
            addEventListener("resize", positionTimelineIndicator);
          }
          document.getElementById("previous").addEventListener("click", () => selectFrame(selectedIndex - 1));
          document.getElementById("next").addEventListener("click", () => selectFrame(selectedIndex + 1));
          playButton.addEventListener("click", togglePlaying);
          selectFrame(selectedIndex);
          document.getElementById("summary").textContent =
            `${release.history_weeks} past weeks and ${release.forecast_weeks} forecast weeks.`;
          document.getElementById("updated").textContent =
            `Updated ${new Date(release.generated_at_utc).toLocaleString("en-AU", {timeZone: "Australia/Brisbane"})} AEST`;
        } catch (error) {
          document.getElementById("summary").textContent = "The map configuration could not be loaded.";
          const target = document.getElementById("error");
          target.style.display = "block";
          target.textContent = String(error);
        }
      }
      start();
    </script>
    <script type="module" src="email-report.js"></script>
  </body>
</html>
